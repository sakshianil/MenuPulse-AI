services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menupulse
      POSTGRES_PASSWORD: menupulse
      POSTGRES_DB: menupulse
    ports:
      - "5432:5432"
    volumes:
      - menupulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menupulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menupulse_postgres:
